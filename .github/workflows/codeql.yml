name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Catch newly-published query patterns against code that didn't change.
    - cron: "0 6 * * 3"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      # The Rust extractor only supports build-mode "none" — it analyzes
      # source directly rather than needing an actual compile.
      - uses: github/codeql-action/init@v3
        with:
          languages: rust
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
