name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build server binary (ssr)
        run: cargo build --features ssr --bin guidance

      - name: Build seed binary (ssr)
        run: cargo build --features ssr --bin seed

      - name: Build client lib (hydrate/wasm)
        run: cargo build --lib --no-default-features --features hydrate --target wasm32-unknown-unknown

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --features ssr

  end-to-end:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-leptos
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos

      # The prebuilt cargo-leptos is musl-linked and would download the musl
      # Tailwind binary, which can't run on Ubuntu (no musl loader → bare
      # ENOENT). A PATH install takes precedence; version = cargo-leptos default.
      - name: Install Tailwind CSS
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sLo "$HOME/.local/bin/tailwindcss" https://github.com/tailwindlabs/tailwindcss/releases/download/v4.2.1/tailwindcss-linux-x64
          chmod +x "$HOME/.local/bin/tailwindcss"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Real rulebook fixtures aren't committed (users import their own
      # content), so CI seeds from the original mock data in test-fixtures/.
      # Seeds a dedicated e2e.db, never the default dev.db — seed.rs refuses
      # to seed mock data into dev.db (see src/bin/seed.rs).
      - name: Seed the database with mock test fixtures
        run: cargo run --features ssr --bin seed
        env:
          FIXTURES_DIR: test-fixtures
          DATABASE_URL: sqlite://e2e.db

      - name: Install Playwright
        working-directory: end2end
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Builds, serves, then runs the end2end-cmd configured in Cargo.toml.
      - name: Run end-to-end tests
        run: cargo leptos end-to-end
        env:
          DATABASE_URL: sqlite://e2e.db

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: end2end/playwright-report
